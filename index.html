<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d141b">
<title>CASTLE — KnightShip Registry</title>
<link rel="manifest" href="manifest.json">
<style>
  /* ============================================================
     CASTLE v4 — "The Keep's Technical Registry"
     Aerospace type-certificate aesthetic. Monospace data,
     station diagrams, revision blocks, caution flags, blueprint
     draw-on. KnightShip navy/orange kept, refined into tokens.
     ============================================================ */
  :root{
    --navy:#1A3A5C; --navy-lo:#12293f; --navy-hi:#28527d;
    --orange:#E39A1C; --orange-lo:#C2820A; --orange-dim:#8a6a2e;
    --ink:#0a1219; --bg:#0b1219; --panel:#111c26; --panel-2:#16232f;
    --line:#233343; --line-hi:#33485c;
    --text:#e9eff5; --dim:#8ea3b6; --dimmer:#5f7488;
    --good:#4fd08a; --grid:rgba(46,74,102,.16);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --disp:"Eurostile","Bahnschrift","DIN Alternate",-apple-system,BlinkMacSystemFont,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      radial-gradient(120% 80% at 50% -10%, #10202e 0%, var(--bg) 60%);
    color:var(--text); font-family:var(--body); -webkit-text-size-adjust:100%;
    letter-spacing:.1px;
  }
  ::selection{ background:var(--orange); color:#1a1300; }

  /* ---- header: a data-plate ---- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(11,18,25,.96), rgba(11,18,25,.86));
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:10px 14px;
  }
  .plate{ display:flex; align-items:baseline; gap:10px; }
  .plate .mark{ font-family:var(--disp); font-weight:800; font-size:20px; letter-spacing:3px; color:#fff; }
  .plate .mark .k{ color:var(--orange); }
  .plate .sub{ font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.5px; text-transform:uppercase; }
  .plate .ver{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--dimmer); border:1px solid var(--line); padding:2px 6px; border-radius:3px; }

  /* ---- nav: tab strip like a filing system ---- */
  nav{ position:sticky; top:47px; z-index:19; display:flex; gap:2px; overflow-x:auto;
    background:rgba(11,18,25,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:6px 8px; scrollbar-width:none; }
  nav::-webkit-scrollbar{ display:none; }
  nav button{
    font-family:var(--mono); font-size:11px; letter-spacing:.5px; text-transform:uppercase;
    background:transparent; color:var(--dim); border:1px solid transparent; border-radius:5px;
    padding:7px 12px; white-space:nowrap; cursor:pointer; transition:.15s; position:relative;
  }
  nav button:hover{ color:var(--text); }
  nav button.active{ color:#fff; background:var(--navy-lo); border-color:var(--navy-hi); }
  nav button.active::after{ content:''; position:absolute; left:10px; right:10px; bottom:-7px; height:2px; background:var(--orange); }

  main{ padding:16px 14px 60px; max-width:920px; margin:0 auto; }

  /* ---- typographic system ---- */
  .eyebrow{ font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--orange); margin:0 0 4px; }
  h1{ font-family:var(--disp); font-size:26px; letter-spacing:1px; color:#fff; margin:0 0 2px; font-weight:800; }
  h2{ font-family:var(--mono); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim);
      margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  h2::before{ content:''; width:6px; height:6px; background:var(--orange); transform:rotate(45deg); }
  h3{ font-family:var(--disp); font-size:15px; color:var(--orange); margin:16px 0 4px; letter-spacing:.4px; }
  p{ line-height:1.6; color:#d6e0ea; }
  .dim{ color:var(--dim); } .small{ font-size:12px; }

  /* ---- data readouts: monospace, instrument-panel ---- */
  .readout{ font-family:var(--mono); font-size:12.5px; background:linear-gradient(180deg,#0a1119,#0c141d);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:8px 0; overflow-x:auto; }
  .readout .rk{ color:var(--dim); } .readout .rv{ color:#eaf2fa; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:5px 16px; font-family:var(--mono); font-size:12.5px; }
  .kv dt{ color:var(--dim); white-space:nowrap; } .kv dd{ margin:0; color:#eaf2fa; }

  /* ---- vehicle card = data plate ---- */
  .plate-card{ position:relative; background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:10px; padding:0; margin:10px 0; overflow:hidden; cursor:pointer; transition:.18s; }
  .plate-card:hover{ border-color:var(--navy-hi); transform:translateY(-1px); box-shadow:0 6px 22px rgba(0,0,0,.35); }
  .plate-card.picked{ border-color:var(--orange); box-shadow:0 0 0 2px rgba(227,154,28,.35); }
  .xlink{ color:var(--orange); border-bottom:1px dashed var(--orange-dim); cursor:pointer; text-decoration:none; }
  .xlink:hover{ border-bottom-style:solid; }
  select{ width:100%; font-family:var(--mono); font-size:12.5px; background:#0a1119; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:9px; margin:3px 0 8px; }
  label{ display:block; margin-top:6px; }
  button.act.on{ background:var(--orange); color:#1a1300; border-color:var(--orange); }
  .plate-card .pc-top{ display:flex; align-items:stretch; }
  .pc-stamp{ font-family:var(--disp); font-weight:800; font-size:18px; letter-spacing:1px; color:#fff;
    background:var(--navy-lo); border-right:1px solid var(--line); padding:14px 12px; min-width:64px; text-align:center; display:flex; align-items:center; justify-content:center; }
  .pc-main{ padding:11px 13px; flex:1; min-width:0; }
  .pc-desig{ font-family:var(--disp); font-size:16px; color:#fff; letter-spacing:.5px; }
  .pc-role{ font-family:var(--mono); font-size:11px; color:var(--dim); margin-top:2px; }
  .pc-status{ font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:1px; padding:2px 6px; border-radius:3px; border:1px solid var(--line-hi); color:var(--dim); }
  .pc-status.concept{ color:var(--good); border-color:#245c42; }
  .pc-status.teased{ color:var(--orange); border-color:var(--orange-dim); }
  /* station strip mini-diagram */
  .station-strip{ height:22px; display:flex; align-items:center; gap:1px; padding:0 13px 12px; }
  .ss-seg{ height:9px; border-radius:1px; opacity:.85; }

  /* ---- badges / stamps ---- */
  .stamp{ display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
    padding:3px 8px; border:1px solid var(--navy-hi); color:#bcd6ef; border-radius:4px; margin-right:6px; }
  .stamp.orange{ border-color:var(--orange-dim); color:var(--orange); }

  /* ---- caution flag (open items / flagged sections) ---- */
  .flag{ position:relative; background:repeating-linear-gradient(45deg,#20242a,#20242a 10px,#242017 10px,#242017 20px);
    border:1px solid var(--orange-dim); border-left:4px solid var(--orange); border-radius:0 8px 8px 0; padding:10px 12px; margin:8px 0; }
  .flag .fl-body{ background:rgba(11,18,25,.72); padding:6px 8px; border-radius:4px; font-size:13px; line-height:1.5; }

  /* ---- tables ---- */
  table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px; margin:6px 0; }
  th,td{ text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--dim); text-transform:uppercase; font-size:10px; letter-spacing:1px; }
  tr:hover td{ background:rgba(40,82,125,.08); }

  /* ---- revision / changelog block ---- */
  .rev{ display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-family:var(--mono); font-size:12px; border-left:2px solid var(--navy-hi); padding:6px 0 6px 12px; margin:6px 0; }
  .rev .rev-date{ color:var(--orange); } .rev .rev-what{ color:#fff; } .rev .rev-why{ color:var(--dim); grid-column:2; }

  /* ---- buttons / inputs ---- */
  button.act{ font-family:var(--mono); font-size:12px; letter-spacing:.5px; background:var(--navy); color:#fff; border:1px solid var(--navy-hi);
    border-radius:6px; padding:9px 14px; cursor:pointer; margin:4px 4px 4px 0; transition:.15s; }
  button.act:hover{ background:var(--navy-hi); }
  button.act.orange{ background:transparent; border-color:var(--orange-dim); color:var(--orange); }
  button.act.orange:hover{ background:rgba(227,154,28,.12); }
  button.act.ghost{ background:transparent; color:var(--dim); }
  button.act.danger{ background:transparent; border-color:#5c2626; color:#e08a8a; }
  textarea,input{ width:100%; font-family:var(--mono); font-size:12.5px; background:#0a1119; color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:9px; margin:3px 0; }
  input:focus,textarea:focus{ outline:none; border-color:var(--navy-hi); }
  .back{ font-family:var(--mono); font-size:11px; color:var(--orange); cursor:pointer; display:inline-block; margin-bottom:10px; letter-spacing:.5px; }
  .ph{ border:1px dashed var(--line); border-radius:8px; padding:22px; text-align:center; color:var(--dim); font-family:var(--mono); font-size:12px; }
  .row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .card{ background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--line); border-radius:9px; padding:13px; margin:9px 0; }
  .status{ font-family:var(--mono); font-size:11px; padding:5px 9px; border-radius:5px; margin:6px 0; display:none; }
  .status.show{ display:block; } .status.ok{ background:#0f2a1c; color:var(--good); border:1px solid #245c42; } .status.err{ background:#2a1414; color:#e89090; border:1px solid #5c2626; }

  /* ---- IFO ---- */
  .ifo-stage{ background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,
      linear-gradient(180deg,#0c1722,#0a1119);
    border:1px solid var(--line); border-radius:10px; height:210px; display:flex; align-items:center; justify-content:center; gap:14px; position:relative; overflow:hidden; }
  .ifo-ship{ width:70px; height:38px; background:linear-gradient(180deg,#2a3e50,#1c2b39); border:1px solid #35506a; border-radius:6px 20px 20px 6px; opacity:.6; }
  .ifo-dot{ width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block;margin-right:8px;box-shadow:0 0 8px rgba(227,154,28,.6); }
  .chip{ font-family:var(--mono); font-size:11px; background:var(--navy-lo); border:1px solid var(--navy-hi); border-radius:14px; padding:5px 11px; color:#bcd6ef; }

  /* ---- horizontal timeline: a museum rail ---- */
  .tl-rail{ display:flex; overflow-x:auto; padding:34px 6px 16px; position:relative; scrollbar-width:thin; width:max-content; min-width:100%; }
  .tl-rail::before{ content:''; position:absolute; left:12px; right:12px; top:48px; height:2px; background:linear-gradient(90deg,transparent,var(--navy-hi) 4%,var(--navy-hi) 96%,transparent); }
  .tl-node{ min-width:158px; position:relative; padding:0 12px; cursor:pointer; }
  .tl-dot{ width:15px; height:15px; border-radius:50%; background:var(--navy); border:2px solid var(--orange); margin:0 auto 10px; box-shadow:0 0 0 4px rgba(11,18,25,1),0 0 10px rgba(227,154,28,.4); transition:.15s; }
  .tl-node:hover .tl-dot{ background:var(--orange); transform:scale(1.15); }
  .tl-date{ text-align:center; font-family:var(--mono); font-size:10px; color:var(--orange); margin-bottom:3px; letter-spacing:.5px; }
  .tl-title{ text-align:center; font-size:12px; color:var(--text); line-height:1.35; }
  .tl-wrap{ overflow-x:auto; }

  /* ---- flying Pauldron loader ---- */
  .loader{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 0; }
  .flypath{ position:relative; width:100%; max-width:520px; height:70px; overflow:hidden; margin:0 auto; }
  .pauldron{ position:absolute; top:16px; left:0; animation:fly 1.5s linear infinite; z-index:2; }
  @keyframes fly{ from{ transform:translateX(-44px); } to{ transform:translateX(540px); } }
  .ptrail{ position:absolute; top:31px; left:-52px; height:6px; width:52px; border-radius:3px; z-index:1;
    background:linear-gradient(90deg, transparent, rgba(227,154,28,.75)); animation:fly 1.5s linear infinite; }
  .loadtxt{ font-family:var(--mono); font-size:11px; color:var(--dim); margin-top:14px; letter-spacing:1px; }

  /* ---- blueprint draw-on animation ---- */
  @keyframes drawin{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .anim > *{ animation:drawin .32s ease both; }
  .anim > *:nth-child(2){ animation-delay:.03s } .anim > *:nth-child(3){ animation-delay:.06s }
  .anim > *:nth-child(4){ animation-delay:.09s } .anim > *:nth-child(5){ animation-delay:.12s }
  .anim > *:nth-child(6){ animation-delay:.15s } .anim > *:nth-child(n+7){ animation-delay:.18s }
  #boot{ padding:20px; color:var(--dim); font-family:var(--mono); font-size:12px; }
  .scanline{ display:inline-block; width:8px; height:13px; background:var(--orange); margin-left:3px; animation:blink 1s steps(2) infinite; vertical-align:middle; }
  @keyframes blink{ 50%{ opacity:0 } }
</style>
</head>
<body>
<header>
  <div class="plate">
    <span class="mark"><span class="k">C</span>ASTLE</span>
    <span class="sub" id="hsub">Centralized Archive · Systems Tracking · Local Engineering</span>
    <span class="ver" id="hver">—</span>
    <button id="hsearch" style="background:var(--navy-lo);border:1px solid var(--navy-hi);color:#bcd6ef;border-radius:5px;padding:3px 9px;font-family:var(--mono);font-size:11px;cursor:pointer;margin-left:6px">⌕ Search</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="view"><div id="boot">Initializing the keep<span class="scanline"></span></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var VERSION='v5';
  var SUPABASE_URL='https://tvlkxrqrwjgfivwsbniu.supabase.co';
  var SUPABASE_KEY='sb_publishable_Y9rEqbltp4G7BL0OjqxIQw_cj0v0INi';
  var DATA_BASE='./data';

  var sb=null, sbError=null;
  try{ if(window.supabase&&window.supabase.createClient){ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); } else { sbError='Supabase library did not load (CDN blocked or offline).'; } }
  catch(e){ sbError='Supabase init failed: '+(e&&e.message?e.message:e); }

  var state={ index:null, reports:null, vehicles:{}, fleetList:null };
  function el(h){ var t=document.createElement('template'); t.innerHTML=(h||'').trim(); return t.content.firstChild; }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function view(){ return document.getElementById('view'); }
  function paint(html,anim){ var v=view(); v.innerHTML=html; if(anim) v.classList.add('anim'); else v.classList.remove('anim'); }
  function fail(m){ paint('<div class="flag"><div class="fl-body">'+esc(m)+'</div></div>',false); }
  function loadJSON(p){ return fetch(p,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(p+' → HTTP '+r.status); return r.json(); }); }

  // Flying-Pauldron loader (Franco's reference: trapezoid nose, blue 3-section body, grey base module, 2 triangle fins, 3 engine trapezoids)
  function pauldronSVG(){
    return '<svg width="34" height="60" viewBox="0 0 34 60">'
      +'<polygon points="13,2 21,2 24,10 10,10" fill="#8a97a6" stroke="#0a1119" stroke-width="1.5"/>'
      +'<rect x="11" y="10" width="12" height="12" fill="#3a4a63" stroke="#0a1119" stroke-width="1.5"/>'
      +'<rect x="11" y="22" width="12" height="12" fill="#3a4a63" stroke="#0a1119" stroke-width="1.5"/>'
      +'<rect x="11" y="34" width="12" height="12" fill="#3a4a63" stroke="#0a1119" stroke-width="1.5"/>'
      +'<rect x="10" y="46" width="14" height="6" fill="#6b7787" stroke="#0a1119" stroke-width="1.5"/>'
      +'<polygon points="11,44 4,54 11,54" fill="#54627a" stroke="#0a1119" stroke-width="1.5"/>'
      +'<polygon points="23,44 30,54 23,54" fill="#54627a" stroke="#0a1119" stroke-width="1.5"/>'
      +'<polygon points="12,52 15,58 12,58" fill="#2a3444" stroke="#0a1119" stroke-width="1"/>'
      +'<polygon points="16,52 18,58 16,58" fill="#2a3444" stroke="#0a1119" stroke-width="1"/>'
      +'<polygon points="20,52 22,58 20,58" fill="#2a3444" stroke="#0a1119" stroke-width="1"/>'
      +'</svg>';
  }
  function loader(msg){ return '<div class="loader"><div class="flypath"><span class="ptrail"></span><span class="pauldron"><span style="display:inline-block;transform:rotate(90deg)">'+pauldronSVG()+'</span></span></div><div class="loadtxt">'+esc(msg||'LOADING')+'</div></div>'; }
  // Guarantee the Pauldron flies at least one full pass (1.5s) before content shows.
  // Show the loader; resolve only when BOTH the data work is done AND the Pauldron has
  // completed at least one full flight to the right edge. If work finishes mid-flight, the
  // Pauldron flies on to the edge before the page opens; if work takes longer, it loops.
  function minLoad(msg, work){
    paint(loader(msg),false);
    var workDone=false, flewOnce=false, resolved=false, result;
    return new Promise(function(resolve){
      function maybe(){ if(workDone && flewOnce && !resolved){ resolved=true; resolve(result); } }
      var p=document.querySelector('.pauldron');
      if(p){ p.addEventListener('animationiteration', function(){ flewOnce=true; maybe(); }); }
      else { flewOnce=true; } // no element (reduced-motion etc.) — don't block
      // safety: if the animation somehow never fires, don't hang forever
      setTimeout(function(){ flewOnce=true; maybe(); }, 4000);
      Promise.resolve().then(work).then(function(r){ result=r; workDone=true; maybe(); });
    });
  }

  // class → accent color for station strips / stamps
  var CLASS_COLOR={ EX:'#4fd08a', VX:'#57b6e6', LX:'#E39A1C', TX:'#c98a5a', GX:'#b57de0', DX:'#e0687d', MX:'#7de0c8', RX:'#e0d267' };
  function cc(cls){ return CLASS_COLOR[cls]||'#8ea3b6'; }

  // One-time seed: if Supabase vehicles table is empty, import full data from repo JSON.
  function ensureSeed(){
    if(!sb) return Promise.resolve();
    return sb.from('vehicles').select('id',{count:'exact',head:true}).then(function(res){
      if(res.error) throw res.error;
      if((res.count||0)>0) return;
      return loadJSON(DATA_BASE+'/index.json').then(function(ix){
        var order=['ex1','ex2','ex3','ex4','vx11','vx12','vx13','vx14','lx21','lx22','lx23','lx24','gx04','tx03','tx04','mx72','mx74','mx77','mx79','dx91','dx92','dx93','dx94'];
        return Promise.all(ix.vehicles.map(function(v){
          return loadJSON(DATA_BASE+'/vehicles/'+v.id+'.json').then(function(d){
            var core={specs:d.specs||{},components:d.components||[],capabilities:d.capabilities||[],modules:d.modules||[],calculations:d.calculations||[],blueprint:d.blueprint||{},comparisons:d.comparisons||[],sections:d.sections||[],decisions:d.decisions||[],openItems:d.openItems||[],changelog:d.changelog||[],icon:d.icon||null,views:d.views||{},missionSequence:d.missionSequence||[]};
            return { id:d.id,name:d.name||'',designation:d.designation||'',class:d.class||'',class_quality:d.classQuality||'',role:d.role||'',status:d.status||'concept',summary:d.summary||'',description:d.description||'',data:core,sort:(order.indexOf(d.id)<0?100:order.indexOf(d.id)) };
          }).catch(function(){ return null; });
        })).then(function(rows){ return sb.from('vehicles').insert(rows.filter(Boolean)); })
        .then(function(){ return loadJSON(DATA_BASE+'/reports.json').catch(function(){return {reports:[]};}); })
        .then(function(rep){ var rows=(rep.reports||[]).map(function(r){ return { id:r.id,title:r.title||'',report_date:r.date||null,author:r.author||'Claude',vehicles:r.vehicles||[],body:r.body||'' }; }); if(rows.length) return sb.from('reports').insert(rows); });
      });
    }).catch(function(e){ console.warn('seed skipped:',e&&e.message); });
  }

  function boot(){
    loadJSON(DATA_BASE+'/index.json').then(function(ix){ state.index=ix; return ensureSeed(); })
    .then(function(){ document.getElementById('hver').textContent=VERSION; buildNav(); var hs=document.getElementById('hsearch'); if(hs) hs.onclick=function(){ route('search'); }; route('fleet'); })
    .catch(function(e){ fail('Could not initialize — '+(e&&e.message?e.message:e)); });
  }

  var TABS=[['fleet','Fleet'],['mission','Mission'],['status','Status'],['reports','Reports'],['timeline','Timeline'],['architect','Architect'],['photos','Photos'],['data','Backup']];
  function buildNav(){ var n=document.getElementById('nav'); n.innerHTML=''; TABS.forEach(function(t){ var b=el('<button data-tab="'+t[0]+'">'+t[1]+'</button>'); b.onclick=function(){ route(t[0]); }; n.appendChild(b); }); }
  function setActive(tab){ Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){ b.classList.toggle('active',b.dataset.tab===tab); }); }
  function route(tab,arg){ try{ setActive(tab); window.scrollTo(0,0);
    if(tab==='fleet') return arg?renderVehicle(arg):renderFleet();
    if(tab==='mission') return renderMission();
    if(tab==='status') return renderStatus();
    if(tab==='reports') return renderReports();
    if(tab==='timeline') return renderTimeline();
    if(tab==='architect') return renderArchitect();
    if(tab==='photos') return renderPhotos();
    if(tab==='data') return renderData();

  /* ========================================================
     MISSION — exact Δv calculator, calc toolkit, visual planner.
     Core physics: Tsiolkovsky Δv = Isp·g0·ln(m0/mf). Verified
     against LX-23 (7,778 vs 7,780 m/s). No inputs are invented;
     vehicles lacking worked masses/Isp are refused, not guessed.
     ======================================================== */
  var G0=9.80665;
  // Mission-leg Δv budgets from LEO (standard approximate values, m/s).
  var PROFILES={
    'leo':{label:'To LEO (ascent from pad)', legs:[['Ascent to LEO',9400]], refuelAt:null},
    'geo':{label:'LEO → GEO (one way)', legs:[['GTO injection',2440],['GEO circularize',1470]], refuelAt:'leo'},
    'lunar_orbit':{label:'LEO → Lunar orbit (one way)', legs:[['Trans-lunar injection',3120],['Lunar orbit insertion',900]], refuelAt:'leo'},
    'lunar_orbit_rt':{label:'LEO → Lunar orbit → return', legs:[['TLI',3120],['LOI',900],['Trans-Earth injection',900]], refuelAt:'leo'},
    'lunar_surface':{label:'Lunar orbit → surface → orbit', legs:[['Descent',1900],['Ascent',1900]], refuelAt:'lunar'},
    'mars_orbit':{label:'LEO → Mars orbit (one way)', legs:[['Trans-Mars injection',3600],['Mars orbit insertion',1400]], refuelAt:'leo'},
    'mars_orbit_rt':{label:'LEO → Mars orbit → return', legs:[['TMI',3600],['MOI',1400],['Trans-Earth injection',2000]], refuelAt:'mars'}
  };
  // Pull the exact mass state needed for Tsiolkovsky. Returns {prop,dry,payload,isp} or null with a reason.
  function massState(d){
    var s=(d.data&&d.data.specs)||d.specs||{};
    var prop=numOr(s.propellant_t), dry=numOr(s.dryMass_t), pay=numOr(s.payload_t), isp=numOr(s.isp_vac_s);
    // EX-3 stores wet+dry+payload but not prop → derive prop = wet - dry - payload
    if(prop==null && numOr(s.wetMass_t)!=null && dry!=null){ var pv=(pay!=null?pay:0); prop=numOr(s.wetMass_t)-dry-pv; }
    if(prop==null||dry==null||isp==null) return {ok:false, missing:[prop==null?'propellant':null,dry==null?'dry mass':null,isp==null?'Isp':null].filter(Boolean)};
    return {ok:true, prop:prop, dry:dry, payload:(pay!=null?pay:0), isp:isp};
  }
  function numOr(v){ if(v==null) return null; var n=parseFloat(String(v).replace(/[, ]/g,'')); return isNaN(n)?null:n; }
  function tsiolkovsky(m0,mf,isp){ return isp*G0*Math.log(m0/mf); }

  function renderMission(){
    var h='<p class="eyebrow">Flight Dynamics</p><h1>Mission</h1>';
    h+='<div class="row" style="margin-bottom:10px"><button class="act on" data-mtab="calc">Δv Calculator</button><button class="act ghost" data-mtab="tools">Calc Tools</button><button class="act ghost" data-mtab="planner">Planner</button></div>';
    h+='<div id="mtab_body"></div>';
    paint(h,false);
    var body=document.getElementById('mtab_body');

    Array.prototype.forEach.call(view().querySelectorAll('[data-mtab]'),function(b){ b.onclick=function(){ pick(b.dataset.mtab); }; });
    pick('calc');
  }

  /* ---- Δv CALCULATOR (exact) ---- */
  function missionCalc(body){
    var list=state.fleetList||state.index.vehicles||[];
    var h='<p class="dim small">Exact rocket-equation check: Δv = Isp·g₀·ln(m₀/m_f). Pick a vehicle and profile; the tool computes achievable Δv from worked masses and tests dry / LEO-refuel / lunar-refuel / Mars-refuel closure, with tanker rounds. Vehicles without worked masses are refused, not guessed.</p><div id="st" class="status"></div>';
    h+='<div class="card"><label class="dim small">Vehicle</label><select id="m_veh">';
    list.forEach(function(v){ h+='<option value="'+esc(v.id)+'">'+esc(v.designation)+'</option>'; });
    h+='</select><label class="dim small">Mission profile</label><select id="m_prof">';
    Object.keys(PROFILES).forEach(function(k){ h+='<option value="'+k+'">'+esc(PROFILES[k].label)+'</option>'; });
    h+='</select><button class="act" id="m_run" style="margin-top:8px">Run calculation</button></div><div id="m_out"></div>';
    body.innerHTML=h;
    document.getElementById('m_run').onclick=runMissionExact;
  }
  function runMissionExact(){
    var id=document.getElementById('m_veh').value, pk=document.getElementById('m_prof').value, prof=PROFILES[pk];
    var get=sb?sb.from('vehicles').select('*').eq('id',id).single():Promise.resolve({data:null});
    Promise.resolve(get).then(function(res){
      var d=(res&&res.data)?res.data:(state.index.vehicles.filter(function(x){return x.id===id;})[0]||{});
      var desig=d.designation||id, req=prof.legs.reduce(function(a,l){return a+l[1];},0);
      var ms=massState(d), out=document.getElementById('m_out');
      var h='<h2>Result — '+esc(desig)+'</h2><h3>Mission Δv required</h3><div class="readout">';
      prof.legs.forEach(function(l){ h+='<div><span class="rk">'+esc(pad(l[0]))+'</span>  <span class="rv">'+l[1]+' m/s</span></div>'; });
      h+='<div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span class="rk">'+pad('TOTAL required')+'</span>  <span class="rv">'+req+' m/s</span></div></div>';
      if(!ms.ok){ h+='<div class="flag"><div class="fl-body"><b>Cannot compute — missing worked inputs:</b> '+esc(ms.missing.join(', '))+'.<br>'+esc(desig)+' needs these worked before a mission can be evaluated. No number will be invented.</div></div>'; out.innerHTML=h; return; }
      // exact achievable Δv at full tank
      var m0=ms.dry+ms.payload+ms.prop, mf=ms.dry+ms.payload;
      var dv=tsiolkovsky(m0,mf,ms.isp);
      h+='<h3>Vehicle capability (exact)</h3><div class="readout">';
      h+='<div><span class="rk">'+pad('dry + payload')+'</span>  <span class="rv">'+ms.dry+' + '+ms.payload+' = '+mf+' t</span></div>';
      h+='<div><span class="rk">'+pad('+ propellant')+'</span>  <span class="rv">'+ms.prop+' t → m₀ = '+Math.round(m0)+' t</span></div>';
      h+='<div><span class="rk">'+pad('mass ratio')+'</span>  <span class="rv">'+(m0/mf).toFixed(3)+'</span></div>';
      h+='<div><span class="rk">'+pad('Isp (vac)')+'</span>  <span class="rv">'+ms.isp+' s</span></div>';
      h+='<div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span class="rk">'+pad('Δv = Isp·g₀·ln(MR)')+'</span>  <span class="rv">'+Math.round(dv)+' m/s</span></div>';
      h+='<div><span class="rk">'+pad('margin vs mission')+'</span>  <span class="rv" style="color:'+(dv>=req?'var(--good)':'#e89090')+'">'+(dv-req>=0?'+':'')+Math.round(dv-req)+' m/s</span></div></div>';
      if(dv>=req){ h+='<div class="card" style="border-color:#245c42"><b style="color:var(--good)">✓ Closes dry.</b> '+esc(desig)+' performs this profile on one tank — no refuelling.</div>'; }
      else {
        var refLabel={leo:'LEO',lunar:'lunar-orbit',mars:'Mars-orbit'}[prof.refuelAt];
        if(!prof.refuelAt){ h+='<div class="flag"><div class="fl-body">Ascent to LEO cannot be refuel-assisted (no depot below LEO). Must close on the launch stack.</div></div>'; }
        else {
          // exact multi-fill: each full tank yields dv (at this mass state). N fills give N·dv only if payload dropped;
          // conservatively keep payload for all fills (worst case). fills needed:
          var fills=Math.ceil(req/dv);
          var refuels=fills-1;
          h+='<div class="card" style="border-color:'+(refuels<=1?'#245c42':'var(--orange-dim)')+'"><b style="color:'+(refuels<=1?'var(--good)':'var(--orange)')+'">'+(refuels<=1?'✓':'⚠')+' Needs '+refuels+' in-space refuel'+(refuels===1?'':'s')+' at the '+esc(refLabel)+' depot.</b><br><span class="dim small">Each full tank delivers '+Math.round(dv)+' m/s; '+fills+' tank-loads cover '+req+' m/s. Requires a depot at '+esc(refLabel)+'.</span></div>';
          // tanker rounds: prop per fill ÷ tanker delivery
          h+=tankerRoundsExact(ms.prop, refuels+1);
        }
      }
      out.innerHTML=h; wireXlinks(out);
    });
  }
  function tankerRoundsExact(propPerFill, fills){
    // Worked tanker deliveries: EX-3 delivers 10 t/run (the near-term refueler, available before LX-23);
    // LX-23 delivers ~50 t/trip (far-future heavy tanker).
    var totalProp=propPerFill*fills;
    var ex3=Math.ceil(totalProp/10), lx23=Math.ceil(totalProp/50);
    var h='<h3>Tanker rounds (exact)</h3><div class="readout">';
    h+='<div><span class="rk">'+pad('prop per fill')+'</span>  <span class="rv">'+Math.round(propPerFill)+' t</span></div>';
    h+='<div><span class="rk">'+pad('total fills')+'</span>  <span class="rv">'+fills+'</span></div>';
    h+='<div><span class="rk">'+pad('total propellant')+'</span>  <span class="rv">'+Math.round(totalProp)+' t</span></div>';
    h+='<div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span class="rk">'+pad('EX-3 @ 10 t/run')+'</span>  <span class="rv">'+ex3+' run(s)</span> <span class="dim">— near-term refueler</span></div>';
    h+='<div><span class="rk">'+pad('LX-23 @ 50 t/trip')+'</span>  <span class="rv">'+lx23+' run(s)</span> <span class="dim">— far-future</span></div></div>';
    h+='<p class="dim small">The EX-3 is the fleet\u2019s near-term refuelling ship (available before the LX-23). LX-23 becomes the heavy tanker in the far future. Both use worked delivery figures.</p>';
    return h;
  }

  function toolTsi(tb){
    tb.innerHTML=guide('The rocket equation. Given a wet mass, dry mass, and exhaust velocity (Isp), it gives the Δv a stage can produce. Use it whenever you need to know if a stage closes a burn.')
      +'<div class="card"><label class="dim small">m₀ wet (t)</label>'+inp('t_m0','full mass')+'<label class="dim small">m_f dry (t)</label>'+inp('t_mf','empty mass')+'<label class="dim small">Isp vac (s)</label>'+inp('t_isp','e.g. 360')+'<button class="act" id="t_go">Compute Δv</button></div><div id="t_out"></div>';
    document.getElementById('t_go').onclick=function(){ var m0=num('t_m0'),mf=num('t_mf'),isp=num('t_isp'); var o=document.getElementById('t_out'); if(m0==null||mf==null||isp==null||mf<=0||m0<=mf){ o.innerHTML='<div class="flag"><div class="fl-body">Need m₀ > m_f > 0 and an Isp.</div></div>'; return; } var dv=tsiolkovsky(m0,mf,isp); o.innerHTML='<div class="readout"><div><span class="rk">'+pad('MR = m₀/m_f')+'</span>  <span class="rv">'+(m0/mf).toFixed(3)+'</span></div><div><span class="rk">'+pad('Δv = Isp·g₀·ln(MR)')+'</span>  <span class="rv">'+Math.round(dv)+' m/s</span></div><div class="dim">= '+isp+' × 9.80665 × ln('+(m0/mf).toFixed(3)+')</div></div>'; };
  }
  function toolHover(tb){
    tb.innerHTML=guide('Momentum-theory hover power for a rotorcraft (EX-1/EX-2 class). Given weight, rotor disc area, and figure of merit, it gives the shaft power to hover. Use it when sizing tiltrotor propulsion.')
      +'<div class="card"><label class="dim small">MTOW (t)</label>'+inp('h_w','mass')+'<label class="dim small">Rotor radius (m, per rotor)</label>'+inp('h_r','e.g. 5.75')+'<label class="dim small"># rotors</label>'+inp('h_n','e.g. 2')+'<label class="dim small">Figure of merit</label>'+inp('h_fm','0.72')+'<button class="act" id="h_go">Compute power</button></div><div id="h_out"></div>';
    document.getElementById('h_go').onclick=function(){ var w=num('h_w'),r=num('h_r'),n=num('h_n'),fm=num('h_fm'); var o=document.getElementById('h_out'); if([w,r,n,fm].some(function(x){return x==null;})||r<=0||n<=0||fm<=0){ o.innerHTML='<div class="flag"><div class="fl-body">Need all four inputs, positive.</div></div>'; return; } var rho=1.225; var A=n*Math.PI*r*r; var T=w*1000*G0; var Pideal=Math.pow(T,1.5)/Math.sqrt(2*rho*A); var P=Pideal/fm; o.innerHTML='<div class="readout"><div><span class="rk">'+pad('disc area A')+'</span>  <span class="rv">'+A.toFixed(1)+' m²</span></div><div><span class="rk">'+pad('thrust T = W')+'</span>  <span class="rv">'+Math.round(T)+' N</span></div><div><span class="rk">'+pad('P_ideal=T^1.5/√(2ρA)')+'</span>  <span class="rv">'+(Pideal/1e6).toFixed(2)+' MW</span></div><div><span class="rk">'+pad('P = P_ideal / FM')+'</span>  <span class="rv">'+(P/1e6).toFixed(2)+' MW</span></div><div class="dim">ρ=1.225 kg/m³ (sea level)</div></div>'; };
  }
  function toolMass(tb){
    tb.innerHTML=guide('Bottom-up dry-mass build-up with a growth margin. Enter subsystem masses (comma-separated t), pick a margin %, and it sums them. Use it to estimate a vehicle\u2019s dry mass honestly instead of top-down guessing.')

  function toolVol(tb){

  function toolStage(tb){

  /* ---- VISUAL PLANNER ---- */
  function missionPlanner(body){
    var list=state.fleetList||state.index.vehicles||[];
    var h='<p class="dim small">Chain fleet vehicles into a mission architecture. Each hop shows its role; vehicles with worked Δv show it. Build the flow, see the chain.</p>';
    h+='<div class="card"><label class="dim small">Add a hop</label><select id="pl_pick"><option value="">— pick a vehicle —</option>';
    list.forEach(function(v){ h+='<option value="'+esc(v.id)+'">'+esc(v.designation)+' — '+esc(v.role)+'</option>'; });
    h+='</select><div class="row"><button class="act" id="pl_add">Add hop</button><button class="act ghost" id="pl_clear">Clear</button></div></div>';
    h+='<div id="pl_chain"></div>';
    body.innerHTML=h;
    var chain=[];
    function draw(){
      var c=document.getElementById('pl_chain');
      if(!chain.length){ c.innerHTML='<div class="ph">No hops yet. Add vehicles to build a mission chain (e.g. EX-3 → MX-79 → EX-4 → GX-04).</div>'; return; }
      var hh='<h2>Mission chain</h2>';
      chain.forEach(function(v,i){
        var ms=massState(v); var dv = ms.ok? Math.round(tsiolkovsky(ms.dry+ms.payload+ms.prop, ms.dry+ms.payload, ms.isp)) : null;
        hh+='<div class="card" style="border-left:3px solid '+cc(v.class)+'"><div class="row" style="justify-content:space-between"><b style="color:#fff">'+(i+1)+'. '+esc(v.designation)+'</b><span class="stamp" style="border-color:'+cc(v.class)+';color:'+cc(v.class)+'">'+esc(v.class)+'</span></div><div class="dim small">'+esc(v.role)+'</div>'+(dv!=null?'<div class="dim small" style="font-family:var(--mono)">achievable Δv '+dv+' m/s</div>':'<div class="dim small">Δv not worked</div>')+'</div>';
        if(i<chain.length-1) hh+='<div style="text-align:center;color:var(--orange);font-size:20px;margin:-4px 0">↓</div>';
      });
      c.innerHTML=hh;
    }
    document.getElementById('pl_add').onclick=function(){ var id=document.getElementById('pl_pick').value; if(!id) return; var v=list.filter(function(x){return x.id===id;})[0]; if(v){ chain.push(v); draw(); } };
    document.getElementById('pl_clear').onclick=function(){ chain=[]; draw(); };
    draw();
  }

    if(!needSB()) return;
    paint(loader('LOADING ARCHITECT LOG'),false);
    sb.from('architect_log').select('*').order('entry_date',{ascending:false}).then(function(res){
      var data=res.data||[], error=res.error;
      var h='<p class="eyebrow">Chief Architect</p><h1>Architect Log</h1><p class="dim small">Franco\'s own record. Editable, saved to the database.</p><div id="st" class="status"></div>';
      h+='<h2>Voice Note (local)</h2><div class="row"><button class="act" id="recBtn">● Record</button><span id="recStatus" class="dim small"></span></div><div id="recOut"></div>';
      h+='<h2>Add / Edit Entry</h2><div class="card"><input id="a_title" placeholder="Title"><input id="a_date" type="date"><textarea id="a_body" rows="4" placeholder="Write your entry"></textarea><input type="hidden" id="a_id"><div class="row"><button class="act" id="a_save">Save</button><button class="act ghost" id="a_clear">Clear</button></div></div>';
      if(error) h+='<div class="flag"><div class="fl-body">Load error: '+esc(error.message)+'</div></div>';
      h+='<h2>Entries</h2><div id="alist"></div>';
      paint(h,true);
      var list=document.getElementById('alist');
      data.forEach(function(e){ var card=el('<div class="card"><h3 style="margin-top:0">'+esc(e.title)+'</h3><div class="dim small" style="font-family:var(--mono)">'+esc(e.entry_date||'')+' · '+esc(e.entry_type||'text')+'</div><p>'+esc(e.body)+'</p><div class="row"><button class="act ghost">Edit</button><button class="act danger">Delete</button></div></div>');
        var b=card.querySelectorAll('button');
        b[0].onclick=function(){ document.getElementById('a_title').value=e.title||''; document.getElementById('a_date').value=e.entry_date||''; document.getElementById('a_body').value=e.body||''; document.getElementById('a_id').value=e.id; window.scrollTo(0,0); };
        b[1].onclick=function(){ if(!confirm('Delete this entry?'))return; sb.from('architect_log').delete().eq('id',e.id).then(function(r){ if(r.error) return status('err',r.error.message); route('architect'); }); };
        list.appendChild(card); });
      document.getElementById('a_save').onclick=function(){ var id=document.getElementById('a_id').value; var rec={ title:document.getElementById('a_title').value, entry_date:document.getElementById('a_date').value||null, body:document.getElementById('a_body').value, entry_type:'text', updated_at:new Date().toISOString() };
        if(!rec.title) return status('err','Title required.'); var q=id?sb.from('architect_log').update(rec).eq('id',id):sb.from('architect_log').insert(rec); q.then(function(r){ if(r.error) return status('err',r.error.message); route('architect'); }); };
      document.getElementById('a_clear').onclick=function(){ ['a_title','a_date','a_body','a_id'].forEach(function(i){ document.getElementById(i).value=''; }); };
      wireRec();
    });
  }
  function wireRec(){ var btn=document.getElementById('recBtn'); if(!btn)return; var st=document.getElementById('recStatus'), out=document.getElementById('recOut'), mr, chunks=[], rec=false;
    btn.onclick=function(){ if(!rec){ navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ mr=new MediaRecorder(stream); chunks=[]; mr.ondataavailable=function(e){chunks.push(e.data);}; mr.onstop=function(){ var url=URL.createObjectURL(new Blob(chunks,{type:'audio/webm'})); out.innerHTML='<audio controls src="'+url+'" style="width:100%;margin-top:8px"></audio><p class="dim small">Recorded locally. Uploading audio is a later pass.</p>'; }; mr.start(); rec=true; btn.textContent='■ Stop'; st.textContent='recording…'; }).catch(function(e){ st.textContent='mic unavailable: '+e.message; }); } else { mr.stop(); rec=false; btn.textContent='● Record'; st.textContent='saved below'; } };
  }

  function renderPhotos(){
    if(!needSB()) return;
    paint(loader('LOADING GALLERY'),false);
    sb.from('photos').select('*').order('created_at',{ascending:false}).then(function(res){
      var data=res.data||[], error=res.error;
      var h='<p class="eyebrow">Archive</p><h1>Photos</h1><p class="dim small">Images upload to CASTLE storage and display here.</p><div id="st" class="status"></div>';
      h+='<div class="card"><input type="file" id="pf" accept="image/*"><input id="pt" placeholder="Title"><input id="pd" type="date"><input id="pvid" placeholder="Vehicle id (optional)"><textarea id="pdesc" rows="2" placeholder="Description"></textarea><button class="act" id="padd">Upload</button> <span id="upst" class="dim small"></span></div><div id="plist"></div>';
      if(error) h+='<div class="flag"><div class="fl-body">'+esc(error.message)+'</div></div>';
      paint(h,true);
      var list=document.getElementById('plist');
      function photoCard(e){ var img=e.image_url?'<img src="'+esc(e.image_url)+'" style="max-width:100%;border-radius:6px;margin-bottom:8px">':''; return el('<div class="card">'+img+'<h3 style="margin-top:0">'+esc(e.title)+'</h3><div class="dim small" style="font-family:var(--mono)">'+esc(e.entry_date||'')+(e.vehicle_id?' · '+esc(e.vehicle_id):'')+'</div><p>'+esc(e.description)+'</p></div>'); }
      data.forEach(function(e){ list.appendChild(photoCard(e)); });
      document.getElementById('padd').onclick=function(){
        var f=document.getElementById('pf').files[0];
        var rec={ title:document.getElementById('pt').value||'(untitled)', entry_date:document.getElementById('pd').value||null, vehicle_id:document.getElementById('pvid').value||null, description:document.getElementById('pdesc').value||'' };
        var up=document.getElementById('upst');
        var doInsert=function(url){ rec.image_url=url||null; sb.from('photos').insert(rec).select().then(function(r){ if(r.error) return status('err',r.error.message); var row=(r.data&&r.data[0])||rec; list.insertBefore(photoCard(row), list.firstChild); status('ok','Saved.'); up.textContent=''; document.getElementById('pt').value=''; document.getElementById('pdesc').value=''; document.getElementById('pf').value=''; }); };
        if(f){ up.textContent='uploading…'; var path=Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          sb.storage.from('photos').upload(path,f,{upsert:false}).then(function(u){ if(u.error){ status('err','Upload: '+u.error.message); doInsert(null); return; } var pub=sb.storage.from('photos').getPublicUrl(path); doInsert(pub.data.publicUrl); });
        } else { doInsert(null); }
      };
    });
  }

  function renderData(){
    var h='<p class="eyebrow">Maintenance</p><h1>Backup</h1><p class="dim small">Export the database logs (architect, timeline, photos).</p><button class="act" id="exp">Export logs</button><div id="st" class="status"></div>';
    h+='<h2>Repo Data</h2><p class="dim small">Vehicles and reports live in the GitHub repo as JSON. This backup covers the app-editable logs.</p>';
    paint(h,true);
    document.getElementById('exp').onclick=function(){ if(!sb) return status('err',sbError||'no database');
      Promise.all([sb.from('architect_log').select('*'),sb.from('timeline').select('*'),sb.from('photos').select('*')]).then(function(rs){
        var dump={ architect_log:rs[0].data||[], timeline:rs[1].data||[], photos:rs[2].data||[], exported:new Date().toISOString() };
        var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(dump,null,2)],{type:'application/json'})); a.download='castle-logs-backup.json'; a.click(); status('ok','Exported.'); }); };
  }

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  boot();
})();
</script>
</body>
</html>
